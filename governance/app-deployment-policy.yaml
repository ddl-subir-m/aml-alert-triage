# The policy "App deployment policy" (domino-agent-service spec #260): the definition, in Domino's policy YAML.
#
# The shape is Domino's policy YAML (docs.domino.ai, Governance, "Policy components"), as the agent trigger test's policy had it when
# it went from Draft to Published. The artifacts' content shapes are in Domino's governance API spec (GET /policies/{id} and
# POST /rpc/submit-result-to-policy). Domino gives each artifact its own ID when it reads this file: read them with GET /policies/{id}
# (the gateway tool get_policy), and find each field by its evidence item's name and its label.
stages:
  - name: Intake
    evidenceSet:
      - id: Local.app-intake
        name: Intake
        description: What the App is for, who uses it, and the class of its data. The analyst fills it.
        definition:
          - artifactType: input
            details:
              type: textarea
              label: Purpose
              placeholder: What the App does, and for whom
          - artifactType: input
            details:
              type: textinput
              label: Users
              placeholder: The people or teams that use the App
          - artifactType: input
            details:
              type: radio
              label: Data class
              options:
                - label: Public
                  value: "Public"
                - label: Internal
                  value: "Internal"
                - label: Confidential
                  value: "Confidential"
                - label: Restricted
                  value: "Restricted"
  - name: Validation
    evidenceSet:
      - id: Local.validation-agent-folder
        name: Validation (agent folder)
        description: The result of the agent folder validator (harness lane, opencode). The validator fills it.
        definition:
          - artifactType: input
            details:
              type: radio
              label: Verdict
              options:
                - label: Approve
                  value: "approve"
                - label: Approve after fixes
                  value: "approve after fixes"
                - label: Do not approve
                  value: "do not approve"
          - artifactType: input
            details:
              type: radio
              label: Critical vulns
              options:
                - label: "Yes"
                  value: "yes"
                - label: "No"
                  value: "no"
          - artifactType: input
            details:
              type: textarea
              label: Summary
          - artifactType: input
            details:
              type: textinput
              label: Doc location
              helpText: Where the validation doc is (its branch and commit). The bundle's Report attachment links it.
      - id: Local.validation-langgraph
        name: Validation (LangGraph)
        description: The result of the LangGraph validator (framework lane). The validator fills it.
        definition:
          - artifactType: input
            details:
              type: radio
              label: Verdict
              options:
                - label: Approve
                  value: "approve"
                - label: Approve after fixes
                  value: "approve after fixes"
                - label: Do not approve
                  value: "do not approve"
          - artifactType: input
            details:
              type: radio
              label: Critical vulns
              options:
                - label: "Yes"
                  value: "yes"
                - label: "No"
                  value: "no"
          - artifactType: input
            details:
              type: textarea
              label: Summary
          - artifactType: input
            details:
              type: textinput
              label: Doc location
              helpText: Where the validation doc is (its dataset snapshot and file). The bundle's attachment links it.
  - name: Approval
