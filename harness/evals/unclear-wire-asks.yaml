# evals/unclear-wire-asks.yaml
# A-1003 is one wire of 46,000 to a new country, with no pattern. The evidence is unclear, so the agent asks the analyst what the
# transaction is for, and writes nothing to the case-management system (rule 6). Before the question, it writes its notes to its
# task memory. This case changes no alert, so it is safe to repeat.
messages:
  - Triage alert A-1003.
expect:
  - tool: domino_aml_get_alert
    args:
      alert_id: A-1003
  - tool: domino_aml_get_transactions
  - tool: write                 # the note of task memory: the agent's file tool, on a file of its task memory folder
    args:
      filePath: task-memory
  - no-tool: domino_aml_close_alert
  - no-tool: domino_aml_escalate_to_sar
  - ends-with: question
