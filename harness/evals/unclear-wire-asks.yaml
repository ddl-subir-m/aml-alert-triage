# evals/unclear-wire-asks.yaml
# A-1003 is one wire of 46,000 to a new country, with no pattern. The evidence is unclear, so the agent asks the analyst what the
# transaction is for, and writes nothing (rule 6). This case writes nothing, so it is safe to repeat.
messages:
  - Triage alert A-1003.
expect:
  - tool: domino_aml_get_alert
    args:
      alert_id: A-1003
  - tool: domino_aml_get_transactions
  - no-tool: domino_aml_close_alert
  - no-tool: domino_aml_escalate_to_sar
  - ends-with: question
